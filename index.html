<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Golden — My life, organized.</title>
<meta name="description" content="Golden — My life, organized.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23030200'/%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='0' y2='1'%3E%3Cstop offset='0%25' stop-color='%23F9E07F'/%3E%3Cstop offset='50%25' stop-color='%23F4A623'/%3E%3Cstop offset='100%25' stop-color='%238A5600'/%3E%3C/linearGradient%3E%3C/defs%3E%3Ctext x='16' y='25' text-anchor='middle' font-family='Georgia,serif' font-weight='300' font-size='26' fill='url(%23g)'%3EG%3C/text%3E%3C/svg%3E" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,600;1,300;1,600&family=DM+Mono:wght@300;400&family=Just+Another+Hand&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{background:#030200;font-family:"Cormorant Garamond",serif;margin:0;padding:0;}
.s{width:100%;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(32px,5vw,64px);padding:80px clamp(24px,5vw,80px);position:relative;overflow:hidden;}
.s::before{content:"";position:absolute;width:80vw;height:80vw;border-radius:50%;top:50%;left:50%;transform:translate(-50%,-50%);background:radial-gradient(circle,#F4A623,transparent);opacity:.06;pointer-events:none;}
.num{font-family:"DM Mono",monospace;font-size:clamp(10px,1vw,13px);letter-spacing:.4em;text-transform:uppercase;color:#C47D0E;opacity:.35;position:absolute;top:32px;left:0;right:0;text-align:center;}
.wm{display:flex;flex-direction:column;align-items:center;gap:clamp(12px,2vw,20px);z-index:1;}
.orn{display:flex;align-items:center;gap:12px;}
.ol{width:clamp(40px,5vw,72px);height:.5px;background:#8A5600;}
.og{width:clamp(6px,0.6vw,9px);height:clamp(6px,0.6vw,9px);background:#F4A623;transform:rotate(45deg);}
.gn{font-family:"Cormorant Garamond",serif;font-weight:300;font-size:clamp(52px,8vw,120px);line-height:1;letter-spacing:.12em;background:linear-gradient(170deg,#FFFBF0,#F9E07F,#F4A623,#C47D0E,#8A5600);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.sub{font-family:"DM Mono",monospace;font-weight:300;font-size:clamp(9px,0.9vw,13px);letter-spacing:.45em;color:#8A5600;text-transform:uppercase;margin-right:-.45em;}
.logos-wrap{display:flex;flex-direction:column;gap:clamp(8px,1.2vw,16px);width:100%;max-width:clamp(380px,55vw,780px);z-index:1;margin:0 auto;}
.row{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(8px,1.2vw,16px);}
.row-2{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(8px,1.2vw,16px);width:100%;}
a.mini{text-decoration:none;}
.mini{
  background:#020810;
  border:1px solid #8A5600;
  border-radius:4px;
  padding:clamp(10px,1.5vw,20px) clamp(6px,1vw,14px);
  display:flex;flex-direction:column;align-items:center;gap:clamp(4px,0.6vw,8px);
  position:relative;overflow:hidden;text-align:center;
  transition:transform .2s,border-color .2s,box-shadow .2s;
}
.mini:hover{transform:translateY(-3px);border-color:#F4A623;box-shadow:0 0 20px rgba(244,166,35,0.15);}
.mini::before{content:"";position:absolute;width:80px;height:80px;border-radius:50%;top:50%;left:50%;transform:translate(-50%,-50%);background:radial-gradient(circle,#F4A623,transparent);opacity:.05;pointer-events:none;}
.mini-type{display:flex;align-items:baseline;}
.mn{font-family:"Just Another Hand",cursive;font-size:clamp(16px,2vw,28px);line-height:1;color:#BAE0FF;}
.ms{width:.5px;height:clamp(14px,1.8vw,26px);margin:0 clamp(3px,0.5vw,8px);align-self:center;background:linear-gradient(180deg,transparent,#8A5600,transparent);}
.mh{font-family:"Just Another Hand",cursive;font-size:clamp(16px,2vw,28px);line-height:1;color:#EFF8FF;}
.ml{font-family:"DM Mono",monospace;font-size:clamp(6px,0.7vw,10px);letter-spacing:.2em;text-transform:uppercase;color:#C47D0E;opacity:.5;margin-right:-.2em;}
.mini-orn{display:flex;align-items:center;gap:clamp(4px,0.6vw,8px);}
.mo{width:clamp(14px,2vw,28px);height:.5px;background:#8A5600;}
.mg{width:clamp(4px,0.5vw,7px);height:clamp(4px,0.5vw,7px);transform:rotate(45deg);flex-shrink:0;background:#F4A623;}
@media(max-width:480px){.logos-wrap{max-width:100%;}.gn{font-size:clamp(44px,14vw,64px);}}
</style>
</head>
<body>
<div class="s">
  <span class="num">Golden</span>
  <div class="wm">
    <div class="orn"><div class="ol"></div><div class="og"></div><div class="ol"></div></div>
    <span class="gn">Golden</span>
    <span class="sub">My life, organized.</span>
  </div>
  <div class="logos-wrap">
    <div class="row">
      <a class="mini" href="https://stonecold93-hue.github.io/KitchenHQ/" target="_blank">
        <div class="mini-orn"><div class="mo"></div><div class="mg"></div><div class="mo"></div></div>
        <div class="mini-type"><span class="mn">Kitchen</span><div class="ms"></div><span class="mh">HQ</span></div>
        <span class="ml">All in one place</span>
      </a>
      <a class="mini" href="https://stonecold93-hue.github.io/househq/" target="_blank">
        <div class="mini-orn"><div class="mo"></div><div class="mg"></div><div class="mo"></div></div>
        <div class="mini-type"><span class="mn">House</span><div class="ms"></div><span class="mh">HQ</span></div>
        <span class="ml">Clean &amp; project organizer</span>
      </a>
      <a class="mini" href="https://stonecold93-hue.github.io/budgetHQ/" target="_blank">
        <div class="mini-orn"><div class="mo"></div><div class="mg"></div><div class="mo"></div></div>
        <div class="mini-type"><span class="mn">Budget</span><div class="ms"></div><span class="mh">HQ</span></div>
        <span class="ml">Depenses &amp; revenus</span>
      </a>
    </div>
    <div class="row-2">
      <a class="mini" href="https://stonecold93-hue.github.io/shoppingHQ/" target="_blank">
        <div class="mini-orn"><div class="mo"></div><div class="mg"></div><div class="mo"></div></div>
        <div class="mini-type"><span class="mn">Shopping</span><div class="ms"></div><span class="mh">HQ</span></div>
        <span class="ml">Your shopping lists</span>
      </a>
      <a class="mini" href="https://golden-beccarichq.netlify.app/" target="_blank">
        <div class="mini-orn"><div class="mo"></div><div class="mg"></div><div class="mo"></div></div>
        <div class="mini-type"><span class="mn">Beccaric</span><div class="ms"></div><span class="mh">HQ</span></div>
        <span class="ml">Notre coin</span>
      </a>
      <a class="mini" href="https://stonecold93-hue.github.io/plantHQ/" target="_blank">
        <div class="mini-orn"><div class="mo"></div><div class="mg"></div><div class="mo"></div></div>
        <div class="mini-type"><span class="mn">Plant</span><div class="ms"></div><span class="mh">HQ</span></div>
        <span class="ml">Gardening all year</span>
      </a>
    </div>
  </div>
</div>
</body>
</html>
